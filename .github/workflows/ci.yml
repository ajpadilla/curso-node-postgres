name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Database for CI
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: nico
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: my_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # Environment variables for Node app
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: nico
      DB_PASSWORD: admin123
      DB_NAME: my_store_test

    steps:
      # Get repo code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # Install deps
      - name: Install dependencies
        run: npm ci

      # Lint
      - name: Run ESLint
        run: npm run lint

      # Prepare database
      - name: Run migrations
        run: npm run db:migrate

      - name: Run seeds
        run: npm run db:seed:run

      # Run API tests
      - name: Run API tests
        run: npm run test:api

      # Run UI tests (Playwright)
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run UI tests
        run: npm run test:ui
