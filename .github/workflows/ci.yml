name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: nico
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: postgres   # Start with default DB
        options: >-
          --health-cmd="pg_isready -U $POSTGRES_USER"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: nico
      DB_PASSWORD: admin123
      DB_NAME: my_store_test

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Lint code
      - name: Run ESLint
        run: npm run lint

      # 5️⃣ Install Postgres client
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # 6️⃣ Wait for Postgres and create test database
      - name: Wait for Postgres and create test database
        run: |
          echo "Waiting for Postgres to be ready..."
          for i in {1..30}; do
            pg_isready -h $DB_HOST -p $DB_PORT -U $DB_USER
            if [ $? -eq 0 ]; then
              echo "Postgres is ready!"
              break
            fi
            echo "Waiting..."
            sleep 2
          done

          echo "Checking if test database exists..."
          DB_EXISTS=$(PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -tAc "SELECT 1 FROM pg_database WHERE datname='$DB_NAME'")
          if [ "$DB_EXISTS" != "1" ]; then
            echo "Database $DB_NAME does not exist. Creating..."
            PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -c "CREATE DATABASE $DB_NAME;"
          else
            echo "Database $DB_NAME already exists."
          fi

      # 7️⃣ Run migrations
      - name: Run migrations
        run: npm run db:migrate

      # 8️⃣ Run seeds
      - name: Run seeds
        run: npm run db:seed:run

      # 9️⃣ Run API tests
      - name: Run API tests
        run: npm run test:api

      # 🔟 Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 1️⃣1️⃣ Run UI tests
      - name: Run UI tests
        run: npm run test:ui
