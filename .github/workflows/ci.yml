name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: nico
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: my_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DB_HOST: postgres      # <-- connect to Postgres service
      DB_PORT: 5432
      DB_USER: nico
      DB_PASSWORD: admin123
      DB_NAME: my_store_test

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Lint code
      - name: Run ESLint
        run: npm run lint

      # 5️⃣ Wait for Postgres and create database
      - name: Wait for Postgres and create database
        run: |
          echo "Waiting for Postgres to be ready..."
          for i in {1..15}; do
            pg_isready -h $DB_HOST -p $DB_PORT -U $DB_USER && break
            echo "Waiting for Postgres..."
            sleep 2
          done
          echo "Creating test database..."
          PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -p $DB_PORT -c "CREATE DATABASE $DB_NAME;"

      # 6️⃣ Run migrations
      - name: Run migrations
        run: npm run db:migrate

      # 7️⃣ Run seeds
      - name: Run seeds
        run: npm run db:seed:run

      # 8️⃣ Run API tests
      - name: Run API tests
        run: npm run test:api

      # 9️⃣ Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 🔟 Run UI tests
      - name: Run UI tests
        run: npm run test:ui
