name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: my_store_test
          POSTGRES_USER: nico
          POSTGRES_PASSWORD: admin123
        options: >-
          --health-cmd="pg_isready -U nico -d my_store_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: nico
      DB_PASSWORD: admin123
      DB_NAME: my_store_test
      JWT_SECRET: hj1Wc7HDrQOILqkAg68yuZEawzeNMsRF
      PORT: 3000

    steps:
      # ------------------------------
      # 1️⃣ Checkout
      # ------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------
      # 2️⃣ Setup Node.js
      # ------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # ------------------------------
      # 3️⃣ Install dependencies
      # ------------------------------
      - name: Install dependencies
        run: npm ci

      # ------------------------------
      # 4️⃣ Wait for Postgres
      # ------------------------------
      - name: Wait for Postgres
        run: |
          echo "Waiting for Postgres to be ready..."
          until pg_isready -h localhost -U nico -d my_store_test; do
            sleep 2
          done
          echo "Postgres is ready"

      # ------------------------------
      # 5️⃣ Run migrations
      # ------------------------------
      - name: Run migrations
        run: npm run db:migrate

      # ------------------------------
      # 6️⃣ Run seeds
      # ------------------------------
      - name: Run seeds
        run: npm run db:seed:run

      # ------------------------------
      # 7️⃣ Start server
      # ------------------------------
      - name: Start Node.js app
        run: |
          echo "Starting server in background..."
          nohup npm start &
          echo "Waiting for server to be ready..."
          n=0
          until curl --silent --fail http://localhost:3000/api/v1/login || [ $n -eq 30 ]; do
            n=$((n+1))
            sleep 2
          done
          echo "Server is ready"

      # ------------------------------
      # 8️⃣ Run ESLint
      # ------------------------------
      - name: Run ESLint
        run: npm run lint

      # ------------------------------
      # 9️⃣ Run UNIT tests
      # ------------------------------
      - name: Run UNIT tests
        run: npm run test

      # ------------------------------
      # 9️⃣ Run API tests
      # ------------------------------
      - name: Run API tests
        run: npm run test:api

      # ------------------------------
      # 🔟 Install Playwright browsers
      # ------------------------------
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # ------------------------------
      # 1️⃣1️⃣ Run UI tests
      # ------------------------------
      - name: Run UI tests
        run: npm run test:ui
