name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: my_store_test
          POSTGRES_USER: nico
          POSTGRES_PASSWORD: admin123
        options: >-
          --health-cmd="pg_isready -U nico -d my_store_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: nico
      DB_PASSWORD: admin123
      DB_NAME: my_store_test
      JWT_SECRET: hj1Wc7HDrQOILqkAg68yuZEawzeNMsRF

    steps:
      # ------------------------------
      # 1️⃣ Checkout
      # ------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------
      # 2️⃣ Node.js
      # ------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # ------------------------------
      # 3️⃣ Dependencies
      # ------------------------------
      - name: Install dependencies
        run: npm ci

      # ------------------------------
      # 4️⃣ Lint
      # ------------------------------
      - name: Run ESLint
        run: npm run lint

      # ------------------------------
      # 5️⃣ Install Postgres client
      # ------------------------------
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # ------------------------------
      # 6️⃣ Wait for Postgres (robust)
      # ------------------------------
      - name: Wait for Postgres
        run: |
          echo "Waiting for Postgres to be ready..."
          until pg_isready -h localhost -U nico -d my_store_test; do
            sleep 2
          done
          echo "Postgres is ready"

      # ------------------------------
      # 7️⃣ Debug DB (VERY useful)
      # ------------------------------
      - name: Debug Postgres
        run: |
          PGPASSWORD=admin123 psql -h localhost -U nico -d my_store_test -c '\l'
          PGPASSWORD=admin123 psql -h localhost -U nico -d my_store_test -c '\dt'

      # ------------------------------
      # 8️⃣ Migrations
      # ------------------------------
      - name: Run migrations
        run: npm run db:migrate

      # ------------------------------
      # 9️⃣ Seeds
      # ------------------------------
      - name: Run seeds
        run: npm run db:seed:run

      # ------------------------------
      # 🔟 API tests
      # ------------------------------
      - name: Run API tests
        run: npm run test

      # ------------------------------
      # 🔟 API tests
      # ------------------------------
      - name: Run API tests
        run: npm run test:api

      # ------------------------------
      # 1️⃣1️⃣ Playwright
      # ------------------------------
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # ------------------------------
      # 1️⃣2️⃣ UI tests
      # ------------------------------
      - name: Run UI tests
        run: npm run test:ui
