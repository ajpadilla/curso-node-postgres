name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: nico
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: my_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: nico
      DB_PASSWORD: admin123
      DB_NAME: my_store_test

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Lint code
      - name: Run ESLint
        run: npm run lint

      # 5️⃣ Create test database
      - name: Create test database
        run: |
          psql -h localhost -U nico -c "CREATE DATABASE my_store_test;"
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }} # fallback if you want

      # 6️⃣ Run migrations
      - name: Run migrations
        run: npm run db:migrate

      # 7️⃣ Run seeds
      - name: Run seeds
        run: npm run db:seed:run

      # 8️⃣ Run API tests
      - name: Run API tests
        run: npm run test:api

      # 9️⃣ Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 🔟 Run UI tests
      - name: Run UI tests
        run: npm run test:ui
