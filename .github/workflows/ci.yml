name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # 1️⃣ Start Postgres service
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: nico
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: my_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # 2️⃣ Environment variables available to all steps
    env:
      NODE_ENV: test
      DB_HOST: postgres       # <-- connects to Postgres service
      DB_PORT: 5432
      DB_USER: nico
      DB_PASSWORD: admin123
      DB_NAME: my_store_test

    steps:
      # 3️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 4️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 5️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 6️⃣ Lint code
      - name: Run ESLint
        run: npm run lint

      # 7️⃣ Create test database
      - name: Create test database
        run: |
          PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -p $DB_PORT -c "CREATE DATABASE $DB_NAME;"

      # 8️⃣ Run migrations
      - name: Run migrations
        run: npm run db:migrate

      # 9️⃣ Run seeds
      - name: Run seeds
        run: npm run db:seed:run

      # 🔟 Run API tests
      - name: Run API tests
        run: npm run test:api

      # 1️⃣1️⃣ Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 1️⃣2️⃣ Run UI tests
      - name: Run UI tests
        run: npm run test:ui
