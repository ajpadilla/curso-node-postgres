name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: nico
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: postgres   # Start with default DB
        options: >-
          --health-cmd="pg_isready -U $POSTGRES_USER"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: nico
      DB_PASSWORD: admin123
      DB_NAME: my_store_test

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Lint code
      - name: Run ESLint
        run: npm run lint

      # 5️⃣ Wait for Postgres to be ready
      - name: Wait for Postgres and create test database
        run: |
          echo "Waiting for Postgres to be ready..."
          for i in {1..30}; do
            docker exec $(docker ps -q -f ancestor=postgres:13) pg_isready -U $DB_USER
            if [ $? -eq 0 ]; then
              echo "Postgres is ready!"
              break
            fi
            echo "Waiting..."
            sleep 2
          done

          echo "Creating test database if it doesn't exist..."
          docker exec $(docker ps -q -f ancestor=postgres:13) \
            psql -U $DB_USER -d postgres -c "DO \$\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_database WHERE datname = '$DB_NAME') THEN
                CREATE DATABASE $DB_NAME;
              END IF;
            END \$\$;"

      # 6️⃣ Run migrations
      - name: Run migrations
        run: npm run db:migrate

      # 7️⃣ Run seeds
      - name: Run seeds
        run: npm run db:seed:run

      # 8️⃣ Run API tests
      - name: Run API tests
        run: npm run test:api

      # 9️⃣ Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 🔟 Run UI tests
      - name: Run UI tests
        run: npm run test:ui
